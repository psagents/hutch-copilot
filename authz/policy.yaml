# authz/policy.yaml — who may run a write through the SAGE gateway (hutch_py_run over HTTP)
#
# Modelled on epics-mcp's authz/policy.yaml. src/hutch_copilot/server.py reads it on every
# gateway write; over ssh (stdio) it is not read, because the write already runs as the caller.
#
# Object types:   hutch:<name>           a hutch (mfx, xpp, ...)
#                 group:<name>           user group
# Relations:      grant                  may run, at a hutch, operations up to an action class
#                 member                 user is a member of a group
# Action classes: write < beam-critical  a grant of beam-critical covers write, not the reverse
#
# Evaluation (any match grants):
#   1. direct_grants:  user → grant → hutch, class
#   2. group grants:   user's group → grant → hutch, class
#
# Users are bare SLAC usernames: the gateway sends someone@slac.stanford.edu, and the server
# strips only that domain. `user` in direct_grants and every `hutch` take fnmatch patterns.
# Default-deny: no grant, no write. A missing, unreadable or malformed file denies every write.
# Unlike epics-mcp's open read grant, there is no open write grant: never add user "*" here.
#
# A granted write still needs the operator's typed approval, and runs as the account that runs
# the tunnel. Adding someone is a pull request; it deploys with the image cron's next pull.

# ── Users ────────────────────────────────────────────────────────────────────
users:
  lconreux:
    groups: [mfx-operators]

# ── Groups ───────────────────────────────────────────────────────────────────
groups:
  mfx-operators:
    grants:
      - {hutch: mfx, class: write}      # runs and motor moves; beam-critical needs its own grant

# ── Direct grants ─────────────────────────────────────────────────────────────
# user → grant → hutch, class   (for one person, without a group)
direct_grants: []
#  - {user: someone, hutch: mfx, class: beam-critical}
