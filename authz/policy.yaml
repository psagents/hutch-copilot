# authz/policy.yaml — example policy: who may run hutch-python through the SAGE gateway
#
# An example, as epics-mcp's authz/policy.yaml: nothing reads this copy. The live policy is the
# tunnel bundle's own policy.yaml, beside its mcp.sock (~/cogito-rmcp-hutch-<hutch>/ on the hutch
# machine), edited there by the server's owner; bin/hutch-mcp passes it as AUTHZ_POLICY_FILE.
# The server reads it on every hutch_py_run, so a change applies without a restart.
#
# Object types:   hutch:<name>           a hutch (mfx, xpp, ...)
#                 group:<name>           user group
# Relations:      grant                  may run hutch-python (hutch_py_run) at a hutch
#                 member                 user is a member of a group
#
# Evaluation (any match grants):
#   1. direct_grants:  user → grant → hutch
#   2. group grants:   user's group → grant → hutch
#
# Users are bare usernames, as the gateway sends them (X-Authenticated-User); `user` in
# direct_grants and every `hutch` take fnmatch patterns. Default-deny: no policy file, no grant,
# no run; a file that cannot be read or evaluated denies every run. Unlike epics-mcp's open read
# grant there is no open grant: never grant user "*".
#
# Why it matters: through the gateway, hutch-python runs as the account that runs the tunnel,
# whoever asks. A grant says who may ask; the operator then approves each call in Claude Code's
# own permission prompt (an `ask` rule bin/hutch-setup installs). Over ssh (stdio) no policy is
# read: hutch-python runs as the caller.

# ── Users ────────────────────────────────────────────────────────────────────
users:
  alice:
    groups: [mfx-operators]
  bob:
    groups: [mfx-operators]
  carol:
    groups: []             # no group membership — only direct grants apply

# ── Groups ───────────────────────────────────────────────────────────────────
groups:
  mfx-operators:
    grants:
      - {hutch: mfx}

# ── Direct grants ─────────────────────────────────────────────────────────────
# user → grant → hutch   (for one person, without a group)
direct_grants:
  - user: carol
    hutch: mfx
