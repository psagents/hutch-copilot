# The unit suite on every push and pull request. 3.9 is psconda's floor (pyproject); 3.12 is the
# image's, and the only one that also runs the MCP server's tests (mcp needs 3.10+).
name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A container, not setup-python: that has no 3.9 for the current Ubuntu runner.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", extras: dev}
          - {python: "3.12", extras: "dev,server"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest
