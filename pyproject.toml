[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hutch-tools"          # import name is hutch_tools; hyphens are illegal in module names
version = "0.2.0"
description = "Tool layer for the hutch-copilot LCLS beamline skill"
requires-python = ">=3.9"          # psconda ships 3.9.20; do not use 3.10+ syntax
license = { text = "SLAC" }
dependencies = []                   # core is stdlib-only, by design

# The package itself is stdlib-only, and test_package_api.py walks the AST of every
# module to keep it that way: a third-party import here is a command that fails on
# arrival for anyone whose environment lacks it.
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

# INSTALLATION IS OPTIONAL AND MUST STAY OPTIONAL.
#
# This package lives inside a Claude Code skill directory, which is loaded by
# path. bin/hutch-* work from a bare checkout with no install step, and that is
# a feature: making the tools require `pip install` would recreate the exact
# failure this refactor removed -- a skill that is broken on arrival for anyone
# who did not set it up the way its author did. At a beamline, `pip install -e`
# into the shared psconda environment is often not possible, and standing up a
# venv is friction nobody wants at 03:00.
#
# So these entry points are a convenience for CI and for developers who want
# `pip install -e .`, never the only route.
[project.scripts]
hutch-state = "hutch_tools.state:main"
hutch-daq = "hutch_tools.daq:main"
hutch-resolve = "hutch_tools.resolve:main"
hutch-lute = "hutch_tools.lute:main"
hutch-log = "hutch_tools.log:main"

[tool.setuptools]
packages = ["hutch_tools"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# Makes hutch_tools importable without an install and without a conftest sys.path
# hack, so the suite behaves identically installed or from a checkout.
pythonpath = ["."]
addopts = "-q"
# Set the option rather than filtering the warning: pytest-asyncio emits it during
# plugin init, before ini filters are installed, so muting it does not work anyway.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".ruff_cache", "__pycache__", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",    # long lines are usually evidence strings in traps.py
    "UP006",   # keep py39-compatible typing under `from __future__ import annotations`
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
# Remote scripts are strings executed elsewhere; local heuristics do not apply.
"hutch_tools/resolve.py" = ["E731"]
"tests/*" = ["B011"]
